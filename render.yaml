# Render blueprint for the API: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo. It builds backend/Dockerfile
# on the free plan. Values marked sync: false are asked for in the UI.

services:
  - type: web
    name: shortlist-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. ["https://your-site.netlify.app"]
      - key: DATABASE_URL
        sync: false          # e.g. postgresql+psycopg://user:pass@host/db?sslmode=require
