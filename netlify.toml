# Netlify builds only the frontend. The API is hosted separately
# (see "Deploy" in README.md) and its URL is set in the Netlify UI as
# the VITE_API_URL environment variable.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router handles every path in the browser, so any URL
# (e.g. a refresh on /dashboard) must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built JS/CSS file names contain a content hash, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
